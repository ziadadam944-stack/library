<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Registration - Academic Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #060913;
            color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Shared Background with Library Image */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(6, 9, 19, 0.88), rgba(6, 9, 19, 0.93)), 
                        url('https://raw.githubusercontent.com/ziadadam944-stack/library/main/piqsels.com-id-scjko.jpg') no-repeat center center/cover;
            z-index: 1;
            pointer-events: none;
        }

        /* Tech Mesh Background Overlay */
        .tech-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotate(-12deg);
            z-index: 2;
            pointer-events: none;
        }

        /* Glowing Orbs */
        .orb-1 {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, rgba(0,0,0,0) 70%);
            top: -10%;
            left: -10%;
            z-index: 3;
            animation: pulseOrb 10s infinite alternate ease-in-out;
        }

        .orb-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(0,0,0,0) 70%);
            bottom: -15%;
            right: -10%;
            z-index: 3;
            animation: pulseOrb 12s infinite alternate-reverse ease-in-out;
        }

        @keyframes pulseOrb {
            0% { transform: scale(1) translateY(0); opacity: 0.7; }
            100% { transform: scale(1.2) translateY(-30px); opacity: 1; }
        }

        /* Floating Academic Elements with Backlight Glow */
        .particle {
            position: absolute;
            font-size: 28px;
            user-select: none;
            pointer-events: none;
            z-index: 4;
            animation: floatParticle 16s infinite ease-in-out;
            filter: drop-shadow(0 0 12px rgba(129, 140, 248, 0.6));
        }

        .p1 { top: 15%; left: 15%; animation-duration: 18s; }
        .p2 { top: 75%; left: 12%; animation-duration: 22s; animation-delay: 2s; filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.6)); }
        .p3 { top: 20%; right: 15%; animation-duration: 15s; animation-delay: 1s; }
        .p4 { top: 80%; right: 18%; animation-duration: 20s; animation-delay: 3s; filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.6)); }
        .p5 { top: 50%; left: 7%; animation-duration: 25s; animation-delay: 4s; }
        .p6 { top: 48%; right: 8%; animation-duration: 17s; animation-delay: 2.5s; filter: drop-shadow(0 0 12px rgba(129, 140, 248, 0.6)); }

        @keyframes floatParticle {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-35px) rotate(10deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        /* Landing Page Style */
        #landing-page {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px;
            max-width: 600px;
            animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #landing-page.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            position: absolute;
        }

        .landing-title {
            font-size: 42px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -1px;
            margin-bottom: 12px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .landing-subtitle {
            font-size: 15px;
            color: #cbd5e1;
            margin-bottom: 30px;
            line-height: 1.6;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* Registration Card Container */
        .box {
            position: relative;
            z-index: 10;
            background: rgba(13, 18, 36, 0.82);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 42px 38px;
            border-radius: 28px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.12);
            width: 440px;
            border: 1px solid rgba(99, 102, 241, 0.25);
            opacity: 0;
            transform: translateY(30px) scale(0.96);
            pointer-events: none;
            position: absolute;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #reg-page.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Top System Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.25);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            color: #4ade80;
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 10px #4ade80;
            animation: blinkDot 1.8s infinite;
        }

        @keyframes blinkDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .system-tag {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Header Style */
        .header {
            text-align: left;
            margin-bottom: 28px;
        }

        .header h2 {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 13.5px;
            color: #94a3b8;
            line-height: 1.4;
        }

        /* Input Group & Custom Fields */
        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12.5px;
            font-weight: 600;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            text-align: left;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-icon {
            position: absolute;
            left: 14px;
            font-size: 15px;
            color: #818cf8;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        input {
            width: 100%;
            padding: 13px 14px 13px 44px;
            border-radius: 14px;
            border: 1.5px solid rgba(255, 255, 255, 0.09);
            background: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
            font-size: 14px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus {
            border-color: #6366f1;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.25);
            transform: translateY(-1px);
        }

        input:focus + .field-icon,
        input:focus ~ .field-icon {
            color: #c084fc;
            transform: scale(1.1);
        }

        input::placeholder {
            color: #475569;
        }

        /* Submit & Action Buttons */
        .primary-btn {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 25px rgba(79, 70, 229, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.3px;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.55);
            background: linear-gradient(135deg, #4338ca, #6d28d9);
        }

        .primary-btn:active {
            transform: translateY(0);
        }

        .btn-arrow {
            transition: transform 0.3s ease;
        }

        .primary-btn:hover .btn-arrow {
            transform: translateX(4px);
        }

        /* Output Messages */
        #msg {
            margin-top: 20px;
            font-size: 13px;
            font-weight: 600;
            min-height: 24px;
            transition: all 0.3s ease;
            text-align: center;
            border-radius: 10px;
        }

        .msg-success {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80 !important;
            padding: 10px;
            animation: fadeIn 0.4s ease-in;
        }

        .msg-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171 !important;
            padding: 10px;
            animation: fadeIn 0.4s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>
    <div class="tech-grid"></div>
    <div class="orb-1"></div>
    <div class="orb-2"></div>

    <!-- Floating Technical Elements with Backlight Glow -->
    <div class="particle p1">📚</div>
    <div class="particle p2">🎓</div>
    <div class="particle p3">📖</div>
    <div class="particle p4">🔬</div>
    <div class="particle p5">💻</div>
    <div class="particle p6">📜</div>

    <!-- 1. Landing Page -->
    <div id="landing-page">
        <h1 class="landing-title">WELCOME TO HICMIS LIBRARY</h1>
        <p class="landing-subtitle">Central University Student Portal for library books.</p>
        <button class="primary-btn" id="startBtn" style="max-width: 240px; margin: 0 auto;">
            <span>GET STARTED</span>
            <span class="btn-arrow">➔</span>
        </button>
    </div>

    <!-- 2. Registration Page Card -->
    <div class="box" id="reg-page">
        <div class="top-bar">
            <div class="status-pill">
                <div class="status-dot"></div>
                <span>SERVER ACTIVE</span>
            </div>
        </div>

        <div class="header">
            <h2>Library Registration</h2>
            <p>Enter your student details to register in the book database.</p>
        </div>

        <form id="regForm">
            <div class="input-group">
                <label for="name">Full Name</label>
                <div class="input-wrapper">
                    <span class="field-icon">👤</span>
                    <input type="text" id="name" placeholder="e.g. Ziad Osama" required>
                </div>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <span class="field-icon">✉️</span>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
            </div>

            <div class="input-group">
                <label for="code">Student Code</label>
                <div class="input-wrapper">
                    <span class="field-icon">🆔</span>
                    <input type="text" id="code" placeholder="e.g. 20268045" required>
                </div>
            </div>

            <button type="submit" class="primary-btn">
                <span>Submit Registration</span>
                <span class="btn-arrow">➔</span>
            </button>
        </form>

        <div id="msg"></div>
    </div>

    <script>
        // Transition from Landing Page to Registration Page
        document.getElementById('startBtn').addEventListener('click', function() {
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('reg-page').classList.add('active');
        });

        // Form Submission to C++ WinSock Server via ngrok
        document.getElementById('regForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const code = document.getElementById('code').value;
            const msg = document.getElementById('msg');

            msg.className = '';
            msg.innerText = 'Transmitting data ...';
            msg.style.color = '#94a3b8';
            msg.style.background = 'transparent';
            msg.style.border = 'none';

            try {
                const res = await fetch('https://stunner-handset-proofs.ngrok-free.dev', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}&code=${encodeURIComponent(code)}`
                });

                if(res.ok) {
                    msg.className = 'msg-success';
                    msg.innerText = '✅ Login successful!';
                    document.getElementById('regForm').reset();
                } else {
                    msg.className = 'msg-error';
                    msg.innerText = '❌ Server returned connection error.';
                }
            } catch(err) {
                msg.className = 'msg-error';
                msg.innerText = '⚠️ Closed for now, come back later.';
            }
        });
    </script>
</body>
</html>
