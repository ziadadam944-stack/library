<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Registration</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #090d16;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            background-image: 
                radial-gradient(rgba(99, 102, 241, 0.08) 1px, transparent 1px),
                radial-gradient(rgba(168, 85, 247, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        /* Background Animated Glows */
        .bg-glow-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(99, 102, 241, 0.18);
            filter: blur(120px);
            border-radius: 50%;
            top: 10%;
            left: 10%;
            animation: floatGlow 9s infinite alternate ease-in-out;
        }

        .bg-glow-2 {
            position: absolute;
            width: 450px;
            height: 450px;
            background: rgba(168, 85, 247, 0.18);
            filter: blur(140px);
            border-radius: 50%;
            bottom: 5%;
            right: 10%;
            animation: floatGlow 11s infinite alternate-reverse ease-in-out;
        }

        @keyframes floatGlow {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-40px) scale(1.15); }
        }

        /* Floating Academic Items with Backlight Glow behind them */
        .floating-icon {
            position: absolute;
            user-select: none;
            pointer-events: none;
            animation: floatAcademic 14s infinite ease-in-out;
            z-index: 1;
            /* Glowing backlight effect (shadow) behind the icons */
            filter: drop-shadow(0 0 15px currentColor);
            opacity: 0.7;
        }

        .icon-1 { top: 12%; left: 14%; animation-duration: 15s; font-size: 32px; color: rgba(56, 189, 248, 0.9); }
        .icon-2 { top: 78%; left: 15%; animation-duration: 19s; animation-delay: 2s; font-size: 28px; color: rgba(236, 72, 153, 0.9); }
        .icon-3 { top: 18%; right: 14%; animation-duration: 17s; animation-delay: 1s; font-size: 34px; color: rgba(168, 85, 247, 0.9); }
        .icon-4 { top: 72%; right: 15%; animation-duration: 13s; animation-delay: 3s; font-size: 30px; color: rgba(34, 197, 94, 0.9); }
        .icon-5 { top: 45%; left: 6%; animation-duration: 22s; animation-delay: 4s; font-size: 26px; color: rgba(251, 191, 36, 0.9); }
        .icon-6 { top: 42%; right: 7%; animation-duration: 16s; animation-delay: 2s; font-size: 28px; color: rgba(56, 189, 248, 0.9); }

        @keyframes floatAcademic {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(-30px) rotate(12deg) scale(1.1); }
            100% { transform: translateY(0) rotate(0deg) scale(1); }
        }

        /* Card Container with Glassmorphism */
        .box {
            position: relative;
            z-index: 10;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 
                        0 0 1px rgba(255, 255, 255, 0.15);
            width: 380px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #c084fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 24px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1.5px solid #334155;
            background: rgba(30, 41, 59, 0.6);
            color: #fff;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #a855f7;
            background: rgba(30, 41, 59, 0.9);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.35);
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
        }

        #msg {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Background Glow Effects -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <!-- Floating Background Academic Items with Backlight Glow -->
    <div class="floating-icon icon-1">📚</div>
    <div class="floating-icon icon-2">🎓</div>
    <div class="floating-icon icon-3">📖</div>
    <div class="floating-icon icon-4">📝</div>
    <div class="floating-icon icon-5">📜</div>
    <div class="floating-icon icon-6">💡</div>

    <div class="box">
        <h2>Library Registration</h2>
        <form id="regForm">
            <label>Full Name:</label>
            <input type="text" id="name" placeholder="e.g. Ziad Osama" required>

            <label>Email Address:</label>
            <input type="email" id="email" placeholder="student@university.edu" required>

            <label>Student Code:</label>
            <input type="text" id="code" placeholder="e.g. 20268045" required>

            <button type="submit">Register Student</button>
        </form>
        <div id="msg"></div>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const code = document.getElementById('code').value;
            const msg = document.getElementById('msg');

            msg.innerText = 'Connecting...';
            msg.style.color = '#94a3b8';

            try {
                const res = await fetch('https://stunner-handset-proofs.ngrok-free.dev' , {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}&code=${encodeURIComponent(code)}`
                });

                if(res.ok) {
                    msg.style.color = '#4ade80';
                    msg.innerText = 'Data registered successfully!';
                    document.getElementById('regForm').reset();
                } else {
                    msg.style.color = '#f87171';
                    msg.innerText = 'Connection error occurred.';
                }
            } catch(err) {
                msg.style.color = '#f87171';
                msg.innerText = 'Please make sure the C++ server is running!';
            }
        });
    </script>
</body>
</html>
