<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Registration</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 350px; border: 1px solid rgba(255,255,255,0.1); }
        h2 { text-align: center; margin-bottom: 20px; color: #a855f7; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #6366f1, #a855f7); border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { opacity: 0.9; }
        #msg { text-align: center; margin-top: 10px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Library Registration 📚</h2>
        <form id="regForm">
            <label>Full Name:</label>
            <input type="text" id="name" required>

            <label>Email Address:</label>
            <input type="email" id="email" required>

            <label>Student Code:</label>
            <input type="text" id="code" required>

            <button type="submit">Register</button>
        </form>
        <div id="msg"></div>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const code = document.getElementById('code').value;
            const msg = document.getElementById('msg');

            try {
                const res = await fetch('https://stunner-handset-proofs.ngrok-free.dev' , {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}&code=${encodeURIComponent(code)}`
                });

                if(res.ok) {
                    msg.style.color = '#4ade80';
                    msg.innerText = 'Data registered successfully!';
                    document.getElementById('regForm').reset();
                } else {
                    msg.style.color = '#f87171';
                    msg.innerText = 'Connection error occurred.';
                }
            } catch(err) {
                msg.style.color = '#f87171';
                msg.innerText = 'Please make sure the C++ server is running!';
            }
        });
    </script>
</body>
</html>
